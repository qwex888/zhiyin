version: '3.8'

services:
  zhiyin-music:
    image: qwex333/zhiyin-music:latest
    container_name: zhiyin-music

    # ──────────────────────────────────────────────────────────────
    # User identity (uid/gid) — common root cause of "failed to write tags" when scraping
    # ──────────────────────────────────────────────────────────────
    # The process inside the container must run as a user that has write permission
    # on the mounted music directory.
    # If host music files are owned by uid=1000 but the container runs as root or
    # another user, TagLib will fail to save tags (logs show: failed to write tags /
    # no write permission on file).
    #
    # Check the owner of the host music directory:
    #   ls -ln /path/to/music | head
    #   # Example output: -rw-r--r-- 1 1000 1000 ...  → uid=1000, gid=1000
    #
    # Example (uncomment and adjust based on your ls -ln result):
    # user: "1000:1000"
    # Or specify uid:gid:
    # user: "1000:1000"   # uid:gid
    #
    # Alternatively, relax permissions on the host (pick one; prefer aligning with user:):
    #   chown -R 1000:1000 /path/to/music
    #   # or chmod -R u+w /path/to/music
    #
    # Note: after changing user, ./data must also be writable by that user,
    # otherwise the database cannot be created.
    # user: "1000:1000"
    
    ports:
      - "8080:8080"
    
    volumes:
      # Music directory - change to your actual path
      # For additional paths, mount them here first, then add the docker path in config.toml
      # Example: - /vol1/1000/Music:/music
      - ./music:/music
      
      # Database directory (persistent)
      - ./data:/data

      # Config file
      # First time: cp config.toml.example config.toml
      # Then edit config.toml
      #- ./config.toml:/app/config.toml:ro
      
      # Cover cache directory (optional, for manual cover management)
      # - ./covers:/covers
      
      
      # Web frontend (optional, mount frontend build output to container)
      # - ./web:/app/web:ro
    
    environment:
      # Log level
      - RUST_LOG=info
      
      # Initial admin (only takes effect on first startup, can be removed after creation)
      # - MUSIC_ADMIN_USER=admin
      # - MUSIC_ADMIN_PASSWORD=your_secure_password
      
      # Note: other settings should be configured in config.toml

    # Memory limit (including file page cache), prevents excessive memory usage on low-memory hosts
    # 256m works for most cases; use 192m for very low memory hosts, 512m for better cache performance
    # mem_limit: 256m
    
    restart: unless-stopped
    
    # Health check (curl/wget not installed in image, uses built-in binary HTTP self-check)
    # If wget is available: test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
    healthcheck:
      test: ["CMD", "zhiyin-music", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    networks:
      - music-network

networks:
  music-network:
    driver: bridge

# Usage:
# 1. Copy config: cp config.toml.example config.toml
# 2. Edit config.toml:
#    - Music scan directories (roots)
#    - Database path (path)
#    - Other optional settings
# 3. Update music directory path in volumes (change ./music to your actual path)
# 4. Start: docker-compose up -d
# 5. View logs: docker-compose logs -f
# 6. Stop: docker-compose down
# 7. Access API: http://localhost:8080/api/songs
# 8. Access docs: http://localhost:8080/swagger-ui
#
# Hot reload config (no restart needed):
#   docker-compose kill -s SIGHUP zhiyin-music

