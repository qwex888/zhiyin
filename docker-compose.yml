version: '3.8'

services:
  zhiyin-music:
    image: zhiyin-music:latest
    container_name: zhiyin-music
    
    # ──────────────────────────────────────────────────────────────
    # 用户身份（uid/gid）— 解决「刮削写入标签失败」的常见根因
    # ──────────────────────────────────────────────────────────────
    # 容器内进程必须以「对挂载音乐目录有写权限」的用户身份运行。
    # 若宿主机音乐文件归 uid=1000 所有，而容器以 root 或其他用户运行，
    # TagLib 保存标签时会失败（日志表现为：写入标签失败 / 文件无写入权限）。
    #
    # 查看宿主机音乐目录所有者：
    #   ls -ln /path/to/music | head
    #   # 输出类似: -rw-r--r-- 1 1000 1000 ...  → uid=1000, gid=1000
    #
    # 示例（按实际 ls -ln 结果取消注释并修改）：
    # user: "1000:1000"
    # 或分别指定：
    # user: "1000:1000"   # uid:gid
    #
    # 也可在宿主机侧放宽权限（二选一，优先用 user: 对齐）：
    #   chown -R 1000:1000 /path/to/music
    #   # 或 chmod -R u+w /path/to/music
    #
    # 注意：修改 user 后，./data 目录也需对应用户可写，否则数据库无法创建。
    # user: "1000:1000"
    
    ports:
      - "8080:8080"
    
    volumes:
      # 音乐目录 - 请修改为你的实际路径，如需更多路径，先在这里挂载目录，然后在 config.toml 中添加 docker路径
      - ./music:/music
      
      # 数据库目录（持久化）
      - ./data:/data
      
      # 封面缓存目录(可选， 如果想手动管理封面)
      #- ./covers:/covers
      
      
      # Web 前端已内置于镜像中（/app/web）
      # 如需使用自定义前端，可取消注释覆盖：
      # - ./web/dist:/app/web:ro
      
      # 配置文件（可选，如需自定义配置请取消注释）
      # 首次使用：cp config.toml.example config.toml
      # 然后修改 config.toml 中的配置
      #- ./config.toml:/app/config.toml:ro
    
    environment:
      # 日志级别
      - RUST_LOG=info
      
      # 初始管理员（仅首次启动时生效，创建后可删除）
      # - MUSIC_ADMIN_USER=admin
      # - MUSIC_ADMIN_PASSWORD=your_secure_password
      
      # 注意：其他配置项请在 config.toml 中修改
    
    # 内存限制（含文件页缓存），防止在小内存主机上占用过多内存
    # 256m 适合大多数场景；极低内存主机可设为 192m，追求缓存加速可设为 512m
    # mem_limit: 256m
    
    restart: unless-stopped
    
    # 健康检查（镜像中未安装 curl/wget，使用内置二进制的 HTTP 自检）
    # 如安装了 wget 可替换为: test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
    healthcheck:
      test: ["CMD", "zhiyin-music", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    networks:
      - music-network

networks:
  music-network:
    driver: bridge

# 使用说明：
# 1. 复制配置文件：cp config.toml.example config.toml
# 2. 修改 config.toml 中的配置：
#    - 音乐扫描目录（roots）
#    - 数据库路径（path）
#    - 其他可选配置
# 3. 修改 volumes 中的音乐目录路径（./music 改为你的实际路径）
# 4. 运行: docker-compose up -d
# 5. 查看日志: docker-compose logs -f
# 6. 停止服务: docker-compose down
# 7. 访问 API: http://localhost:8080/api/songs
# 8. 访问文档: http://localhost:8080/swagger-ui
#
# 配置热重载（无需重启）：
#   docker-compose kill -s SIGHUP zhiyin-music

